# Configuration for the 'cognee' application service
cognee:
  # Image name (using the local image we’ll build in Minikube)
  image: "cognee/cognee:main"
  port: 8000
  env:
    ENV: "local"
    PYTHONPATH: "."
    LLM_MODEL: "openai/gpt-4o-mini"
    LLM_PROVIDER: "openai"
    DATA_ROOT_DIRECTORY: "/data"
    SYSTEM_ROOT_DIRECTORY: "/data/system"
    CACHE_ROOT_DIRECTORY: "/data/cache"
    COGNEE_LOGS_DIR: "/data/logs"
    FASTEMBED_CACHE_PATH: "/data/models/fastembed"
  resources:
    cpu: "4.0"
    memory: "2Gi"
  persistence:
    enabled: true
    size: "10Gi"
    storageClassName: ""

# Configuration for the 'postgres' database service
postgres:
  image: "pgvector/pgvector:pg17"
  port: 5432
  env:
    POSTGRES_USER: "cognee"
    POSTGRES_PASSWORD: "cognee"
    POSTGRES_DB: "cognee_db"
  storage: "2Gi"
