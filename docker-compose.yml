name: cognee

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  env_file:
    - path: .env
      required: true
  networks:
    - cognee-network
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  cognee:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATA_ROOT_DIRECTORY: ${DATA_ROOT_DIRECTORY:-/data}
      SYSTEM_ROOT_DIRECTORY: ${SYSTEM_ROOT_DIRECTORY:-/data/system}
      CACHE_ROOT_DIRECTORY: ${CACHE_ROOT_DIRECTORY:-/data/cache}
      COGNEE_LOGS_DIR: ${COGNEE_LOGS_DIR:-/data/logs}
      FASTEMBED_CACHE_PATH: ${FASTEMBED_CACHE_PATH:-/data/models/fastembed}
      DB_HOST: postgres
      DB_PORT: "5432"
      CACHE_HOST: redis
      CACHE_PORT: "6379"
      GRAPH_DATABASE_HOST: postgres
      GRAPH_DATABASE_PORT: "5432"
      VECTOR_DB_HOST: postgres
      VECTOR_DB_PORT: "5432"
    volumes:
      - cognee_data:/data
    ports:
      - "${COGNEE_HOST:-127.0.0.1}:${COGNEE_PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: ${COGNEE_CPU_LIMIT:-4.0}
          memory: ${COGNEE_MEMORY_LIMIT:-8G}

  frontend:
    <<: *service-defaults
    build:
      context: ./cognee-frontend
      dockerfile: Dockerfile
    environment:
      # This value is used by browser-side code, so it must be reachable from
      # the user's browser rather than only from the Compose network.
      NEXT_PUBLIC_LOCAL_API_URL: ${NEXT_PUBLIC_LOCAL_API_URL:-http://127.0.0.1:8000}
    ports:
      - "${FRONTEND_HOST:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - cognee
    stop_grace_period: 20s

  postgres:
    <<: *service-defaults
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USERNAME:-cognee}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to a strong password}
      POSTGRES_DB: ${DB_NAME:-cognee_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-2.0}
          memory: ${POSTGRES_MEMORY_LIMIT:-4G}

  cognee-mcp:
    <<: *service-defaults
    build:
      context: .
      dockerfile: cognee-mcp/Dockerfile
    command: --no-migration
    environment:
      TRANSPORT_MODE: http
      API_URL: http://cognee:8000
      COGNEE_API_KEY: ${COGNEE_API_KEY:-}
      API_TOKEN: ${COGNEE_API_TOKEN:-}
    volumes:
      - cognee_data:/data
    ports:
      - "${MCP_HOST:-127.0.0.1}:${MCP_PORT:-8001}:8000"
    depends_on:
      - postgres
      - cognee
      - redis
    stop_grace_period: 30s

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$CACHE_PASSWORD\""]
    volumes:
      - redis_data:/data

networks:
  cognee-network:
    driver: bridge

volumes:
  cognee_data:
  postgres_data:
  redis_data:
