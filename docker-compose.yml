name: cognee

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  env_file:
    - path: .env
      required: true
  networks:
    - cognee-network
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  cognee:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - cognee_data:/data
    ports:
      - "${COGNEE_HOST:-127.0.0.1}:${COGNEE_PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: ${COGNEE_CPU_LIMIT:-4.0}
          memory: ${COGNEE_MEMORY_LIMIT:-8G}

  frontend:
    <<: *service-defaults
    build:
      context: ./cognee-frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_HOST:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - cognee
    stop_grace_period: 20s

  postgres:
    <<: *service-defaults
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USERNAME:-cognee}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to a strong password}
      POSTGRES_DB: ${DB_NAME:-cognee_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-2.0}
          memory: ${POSTGRES_MEMORY_LIMIT:-4G}

  cognee-mcp:
    <<: *service-defaults
    build:
      context: .
      dockerfile: cognee-mcp/Dockerfile
    command: --no-migration
    volumes:
      - cognee_data:/data
    ports:
      - "${MCP_HOST:-127.0.0.1}:${MCP_PORT:-8001}:8000"
    depends_on:
      - postgres
      - cognee
      - redis
    stop_grace_period: 30s

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$CACHE_PASSWORD\""]
    volumes:
      - redis_data:/data

networks:
  cognee-network:
    driver: bridge

volumes:
  cognee_data:
  postgres_data:
  redis_data:
